<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>baize webview stub</title>
</head>
<body style="background:#223;color:#cfc;font-family:monospace;padding:16px">
<h2>baize-godot webview stub</h2>
<p id="status">verifying cefViewQuery...</p>
<input id="ime-input" placeholder="点击输入(IME 中文测试)" style="font-size:16px;padding:8px;width:90%;background:#334;color:#cfc;border:1px solid #567;margin-top:8px">
<script>
// 验证桩:实测注入的 cefViewQuery(CEF 151,CefViewCore 包装 CefMessageRouter)。
// 2026-08-03 修正:签名必须是 CEF 官方单对象格式 {request, persistent, onSuccess, onFailure}
// ——旧代码 window.cefViewQuery(req, callback) 多参数调用会在 renderer 侧参数校验失败
// (Uncaught Error: Invalid arguments; expecting a single object),query 从未发出 IPC,
// 宿主永远收不到(C0.4 Win 排障根因)。不装任何静默回退——注入缺失或调用失败必须显式显示。
(function () {
  var status = document.getElementById("status");
  if (typeof window.cefViewQuery !== "function") {
    status.textContent = "ERROR: window.cefViewQuery not injected";
    status.style.color = "#f88";
    return;
  }
  window.cefViewQuery({
    request: "ping",
    persistent: false,
    onSuccess: function (res) {
      status.textContent = "query ok, response: " + res;
      status.style.color = "#cfc";
    },
    onFailure: function (errCode, errMsg) {
      status.textContent = "query failed: " + errCode + " " + errMsg;
      status.style.color = "#f88";
    }
  });
})();
</script>
</body>
</html>
