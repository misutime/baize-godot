version: '3'

dotenv:
  - .env.worktree
  - .env

vars:
  PYTHON: '{{if eq .OS "windows"}}python{{else}}python3{{end}}'

tasks:
  default:
    desc: "列出可用任务"
    cmd: task --list

  dev:
    desc: "构建当前平台开发版编辑器（迭代模式：无调试符号）"
    # 原命令（2026-08-02 注释保留，勿删）：dev_build 默认开 debug_symbols，PDB 568MB，迭代编译慢
    # cmd: '{{.PYTHON}} misc/scripts/build.py --preset dev --jobs {{.JOBS | default "16"}}'
    # 新命令：-- debug_symbols=no 跳过符号生成/链接；-j20 匹配 14700K 20 核；需要符号时用 scons debug_symbols=yes 覆盖
    cmd: '{{.PYTHON}} misc/scripts/build.py --preset dev --jobs {{.JOBS | default "20"}} -- debug_symbols=no'

  pro:
    desc: "构建当前平台 pro 版编辑器"
    cmd: '{{.PYTHON}} misc/scripts/build.py --preset pro --jobs {{.JOBS | default "16"}}'

  stage-webview:
    desc: "预构建 CEF 产物（libcef_dll_wrapper + CefViewWing + CEF 运行时）并暂存到分发目录（首次/换 CEF 版本才构建，产物存在则跳过）；UI 暂存复用 stage_ui（React 壳需先 ui-build）"
    cmd: '{{.PYTHON}} misc/scripts/stage_webview.py'

  ui-build:
    desc: "构建 WebDock React 壳（web/ui）并暂存到 bin/webview/ui/（dock 加载 webview/ui/index.html）"
    cmds:
      - pnpm --dir web/ui build
      - '{{.PYTHON}} misc/scripts/stage_ui.py'


  dev-install:
    desc: "构建并安装开发版编辑器"
    platforms: [darwin]
    cmds:
      - task: dev
        vars:
          JOBS: '{{.JOBS | default "16"}}'
      - mkdir -p ~/Applications
      - ditto bin/godot_macos_editor.app ~/Applications/Godot.app

  pro-install:
    desc: "构建并安装 pro 版编辑器"
    platforms: [darwin]
    cmds:
      - task: pro
        vars:
          JOBS: '{{.JOBS | default "16"}}'
      - mkdir -p ~/Applications
      - ditto bin/godot_macos_editor.app ~/Applications/Godot.app
