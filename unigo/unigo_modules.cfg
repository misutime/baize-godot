# UniGo Godot 内核模块白名单
# =============================================================================
# 用途:定义 UniGo 构建 Godot 内核时启用的模块(modules_enabled_by_default=no,
#       逐个白名单启用)。未在此列表中的模块一律不编译。
#
# 维护约定(架构 §6.3 红线:不做激进物理删除源码,白名单即唯一裁剪入口):
#   - 新增模块:直接追加一行模块名;若该模块有依赖,必须同时加入依赖(见下)。
#   - 删除模块:删除对应行;若它被其他白名单模块依赖,构建脚本会报错提示。
#   - 模块名 = modules/<name> 目录名。依赖声明见各模块 config.py 的
#     env.module_add_dependencies(...),本清单的 [deps] 部分与之一致。
# =============================================================================

# ---- 第一阶段必要模块 -----------------------------------------------
# unigo:我们的 C ABI 模块(纯 C,无 Godot 类,导出 unigo_engine_* 符号)
unigo

# mbedtls:core/crypto 的硬依赖(哈希/加密基础能力)。
# 不可裁剪:core/crypto 的 light 降级路径在 mbedTLS 4.x 下已损坏(上游 bug),
# 且加密是 Godot 核心自身所需,不属于“可选模块”。保留全量模块构建。
mbedtls

# zip:target=editor 的硬依赖(editor/export/android_sdk_manager.cpp 无条件使用
# ZIPReader,无 MODULE_ZIP_ENABLED 包裹)。Android 导出工具需要解压能力。
# 第一阶段虽不做 Godot 原生导出,但 target=editor 形态固定带 editor 代码,故必须含。
zip

# ---- 物理(底层游戏能力,适度宽松纳入) ------------------------------
# godot_physics_2d/3d:Godot 默认物理实现(2D/3D 碰撞与刚体)。
# 物理是游戏底层核心能力,第一阶段虽未做游戏逻辑,但内核需具备物理服务器实现。
# 它们是普通可选模块(受 modules_enabled_by_default 管辖),不显式纳入则不编译。
# 注:visual_shader(可视化 shader 编辑器)与 lightmapper_rd(光照烘焙)属编辑器辅助,
#    非运行时核心,按“上层编辑器功能不纳入”原则排除。
godot_physics_2d
godot_physics_3d

# ---- 渲染/窗口/输入/文本/资源导入链 -----------------------------------
# glslang:GLSL→SPIR-V 编译器,Vulkan 渲染的 shader 编译必需。
# 缺失时 Vulkan 初始化失败(shader_compile_spirv_from_source 报错)→ 回退 OpenGL,
# 而 OpenGL 在嵌入子窗渲染不可见(定稿方案 §1:必须 Vulkan)。故不可裁剪。
glslang
# gltf:GLTF 导入器。第一阶段就启用(资源导入链);注意它依赖 csg+gridmap
gltf            [deps: csg, gridmap]
# fbx:FBX 导入器。依赖 gltf(所以 fbx 与 gltf 一起进)
fbx             [deps: gltf]
# text_server_adv:高级文本服务(编辑器 UI 依赖)
text_server_adv [deps: freetype, msdfgen, svg]

# ---- 纹理/压缩/图像(资源导入链的隐式依赖) ---------------------------
basis_universal [deps: tinyexr]    # 纹理压缩(basisu)
tinyexr                              # basis_universal 的必需依赖
ktx             [deps: basis_universal]  # 压缩纹理容器
svg             [deps: jpg, webp]  # 编辑器强制依赖链
jpg                                  # svg 依赖
webp                                 # svg 依赖
msdfgen          [deps: freetype]   # text_server_adv 依赖
freetype                              # editor 强制依赖 + text_server_adv 依赖

# ---- 编辑器目标强制依赖链 ---------------------------------------------
# editor 目标(scons 第 1147 行)强制 editor→freetype+svg,已含。
# 第一阶段不做 Godot 原生编辑器 UI,但 target=editor 是 EditorNative DLL
# 的固定构建形态(SConstruct 第 610-613 行),不可改为 template_release。

# ---- 明确排除(不在白名单 = 不编译) -----------------------------------
# gdscript  GDScript 语言模块(我们不需要 GDScript 业务逻辑)
# jsonrpc   gdscript 依赖(随之排除)
# websocket gdscript 依赖(随之排除)
# mono      C# 绑定(用 nomono=yes 排除)
# openxr / mobile_vr / visionos_xr  XR(不需要)
# jolt_physics  高级物理(第一阶段用默认 2D 物理,后续按需加)
# navigation_2d/3d  导航(第一阶段不启用)
# 其他未列出的模块均默认不编译
